{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Reset password{% endblock %}
{% block body %}
<div class="auth-panel" style="min-height:100vh"><div class="auth-card">
  <h2 class="fw-bold">Choose a new password</h2>
  {{ m.flashes() }}
  <form method="post" class="needs-validation" novalidate>{{ m.csrf() }}
    <div class="mb-3"><label class="form-label" for="password">New password</label>
      <input class="form-control" type="password" id="password" name="password" required minlength="8" data-password-rule data-strength="#meter" autocomplete="new-password">
      <div class="password-meter mt-2" id="meter"><span></span></div><div class="invalid-feedback">8+ characters with upper, lower case and a number.</div></div>
    <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" required data-match="#password" autocomplete="new-password"><div class="invalid-feedback">Passwords must match.</div></div>
    <button class="btn btn-teal w-100" type="submit">Update password</button>
  </form>
</div></div>
{% endblock %}
